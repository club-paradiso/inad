name: One-time generated release synchronization
on:
  push:
    branches:
      - design/constitution-fixes-2026-10-20
permissions: {}
jobs:
  regenerate:
    if: github.repository == 'club-paradiso/inad' && github.ref == 'refs/heads/design/constitution-fixes-2026-10-20'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build exact generated HTML without write credentials
        run: |
          npm ci
          npm run build
          git diff --check -- index.html
      - name: Commit only generated HTML to the PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add -- index.html
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | grep -Fx index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: synchronize generated INAD entry point (#20)'
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$header" push origin HEAD:refs/heads/design/constitution-fixes-2026-10-20
