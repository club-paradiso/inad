name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# One run per branch/PR: a newer push cancels the older run instead of queueing duplicates.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-integrity:
    # Guards the canonical v6.1 artifact (byte-exact) and the generated release entry point.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical v6.1 artifact (legacy/v6.1)
        run: |
          set -euo pipefail
          test "$(wc -c < legacy/v6.1/INAD_Article12_v6_1_KR.html)" -eq 1514881
          echo "53bee5c1a4fe72a78f5e42eca1f3de0e11623e5d2ded752e995116c742a3a812  legacy/v6.1/INAD_Article12_v6_1_KR.html" | sha256sum -c -
      - name: Verify Article 12 application entry point (root index.html = generated release mirror)
        run: |
          set -euo pipefail
          test -s index.html
          test "$(wc -c < index.html)" -lt 50000
          grep -Fq '<title>INAD</title>' index.html
          grep -Fq 'GENERATED FILE, DO NOT EDIT' index.html
          grep -Fq '2026-09-07' index.html
          grep -Fq 'INAD_SAVE_BUNDLE' index.html
          grep -Fq 'type="module"' index.html
          grep -Fq 'rel="stylesheet"' index.html
          sha256sum index.html
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: AGENTS.md is a copy of CLAUDE.md
        run: cmp AGENTS.md CLAUDE.md
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Root index.html must equal the fresh build (no stale mirror)
        run: git diff --exit-code -- index.html
      - run: npm run test:integrity
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Legacy baseline parity (v6.1 behaviour)
        run: INAD_TARGET=legacy npm run test:e2e
      - name: Dev source parity (native ESM, no bundle) — core flows
        run: INAD_TARGET=src npx playwright test tests/e2e/flows-primary.spec.js tests/e2e/flows-special.spec.js tests/e2e/a11y-structure.spec.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inad-release-dist
          path: dist/
          if-no-files-found: error
  atlas-cross-browser:
    # ATLAS release gate: engine/UI behavior in both non-Chromium engines.
    # Runs the complete overseas case flow, persistence, country switching and mobile layout.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Verify generated release mirror
        run: git diff --exit-code -- index.html
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Cross-browser ATLAS critical journeys
        env:
          INAD_BROWSER: ${{ matrix.browser }}
          INAD_PORT: '4389'
        run: >-
          npx playwright test
          --config playwright.atlas-crossbrowser.config.js
          tests/e2e/atlas.spec.js
          -g 'all three authored cases reach a debrief|view, refresh and country round trips retain case evidence|Korean live interview resumes after country switch|responsive 390'
