<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · Neo-Bureaucratic</title>
<link rel="stylesheet" href="../../../src/styles/tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;font:13px/1.55 var(--font);color:#1d2328;background:#e9e6de;height:100dvh;display:grid;grid-template-columns:300px minmax(0,1fr) 380px;gap:24px;padding:24px}
.card{background:#fbfaf6;border:1px solid #cfc9bb;padding:16px;display:grid;gap:12px;align-content:start}
.lp{position:relative;aspect-ratio:4/5;overflow:hidden;border:1px solid #bdb6a6}.lp canvas,.lp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.lp-live img{visibility:hidden}.lp-fallback canvas{display:none}
h1{margin:0;font:700 26px/1.2 ui-serif,Georgia,"Nanum Myeongjo",serif}.lat{font:600 12px var(--mono);color:#5d5a52}
.kv{display:grid;grid-template-columns:80px 1fr;gap:2px 8px;margin:0;font-size:12px}.kv dt{color:#6d685c}.kv dd{margin:0}
#caption{display:none}
.record{background:#fbfaf6;border:1px solid #cfc9bb;display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.record header{padding:16px 24px;border-bottom:2px solid #1d2328;display:flex;justify-content:space-between;align-items:baseline}.record header h2{margin:0;font:700 17px ui-serif,Georgia,serif}.record header span{font:12px var(--mono);color:#6d685c}
#transcript{overflow:auto;padding:16px 24px;counter-reset:q}.ln{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:6px 0;border-bottom:1px dotted #d6d0c2}.ln .who{font:700 13px ui-serif,Georgia,serif}.ln.officer .who::before{content:"문."}.ln.alien .who::before{content:"답."}.ln.system .who::before{content:"※"}.ln .who{font-size:0}.ln .who::before{font-size:13px}.ln p{margin:0}.ln.alien p{font-size:14px}.ln.system p{color:#6d685c;font-size:12px}
.compose{padding:12px 24px 16px;border-top:1px solid #cfc9bb;display:grid;gap:8px}#suggest{display:flex;flex-wrap:wrap;gap:6px}#suggest button{font:12px var(--font);background:none;border:none;border-bottom:1px solid #8a8473;padding:4px 0;margin-right:12px;text-align:left;color:#3d3a33}
#composer{display:flex;gap:8px;border:1px solid #1d2328;background:#fff}#ask{flex:1;border:0;padding:10px 12px;font:14px var(--font);min-height:44px;background:transparent}#composer button{border:0;border-left:1px solid #cfc9bb;background:none;min-width:56px;font:600 12px var(--font)}
.side{display:grid;grid-template-rows:1fr auto;gap:16px;min-height:0}#docs{overflow:auto;display:grid;gap:12px;align-content:start}.doc{background:#fbfaf6;border:1px solid #cfc9bb;padding:12px 16px}.doc h4{margin:0 0 6px;font:700 13px ui-serif,Georgia,serif}.doc dl{display:grid;grid-template-columns:80px 1fr;margin:0;font-size:12px}.doc dd{margin:0;font-family:var(--mono)}.doc dt{color:#6d685c}
#lookups{display:flex;flex-wrap:wrap;gap:6px}#lookups button{font:12px var(--font);background:#fbfaf6;border:1px solid #cfc9bb;padding:6px 10px}
.dec{display:grid;grid-template-columns:1fr 1fr;gap:6px}.dec button{padding:10px;border:1px solid #1d2328;background:#fbfaf6;font:700 13px var(--font);text-align:left;border-left:4px solid}
.c{border-left-color:var(--success)!important}.s{border-left-color:var(--warning)!important}.r{border-left-color:var(--danger)!important}.j{border-left-color:var(--sjp)!important}
@media (max-width:767px){body{display:block;padding:12px;height:auto}.card{grid-template-columns:120px 1fr}.side{display:none}.record{margin-top:12px;min-height:60dvh}}
</style></head><body>
<aside class="card"><div id="stage"></div><div><h1>쩐 반 민</h1><div class="lat">TRAN VAN MINH</div></div><dl class="kv"><dt>국적</dt><dd>베트남</dd><dt>여권</dt><dd>B80219464</dd><dt>입국기반</dt><dd>C-3-9 단수 · 30일</dd><dt>귀국편</dt><dd>없음</dd></dl><p id="caption"></p></aside>
<section class="record"><header><h2>입국심사 진술 기록</h2><span>A024 · 00:42</span></header><div id="transcript" role="log"></div><div class="compose"><div id="suggest"></div><form id="composer"><input id="ask" placeholder="문. 질문을 입력하십시오"><button type="button">말하기</button><button>기록</button></form></div></section>
<section class="side"><div id="docs"></div><div><div id="lookups"></div><div class="dec" style="margin-top:12px"><button class="c">입국 허가</button><button class="s">입국재심 인계</button><button class="r">입국 불허가</button><button class="j">사범 절차</button></div></div></section>
<script type="module" src="proto.js"></script></body></html>
