<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Avatar lab</title>
<style>
body{margin:0;background:#1d2428;color:#dfe5e8;font:12px system-ui;display:flex;flex-wrap:wrap;gap:8px;padding:8px}
figure{margin:0;width:240px}.lp{position:relative;width:240px;height:300px;overflow:hidden;background:#2a3338}
.lp canvas,.lp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.lp-live img{visibility:hidden}.lp-fallback canvas{display:none}
figcaption{padding:4px 0}
</style></head><body>
<script type="module">
import { createLivingPortrait } from '../../../src/js/ui/avatar/living-portrait.js';
import { PORTRAIT_RIGS } from '../../../src/data/portrait-rigs.js';
const q = new URLSearchParams(location.search); const ids = (q.get('ids') || 'TRV-0005').split(',');
const frames = (q.get('frames') || 'base,blink50,blink100,lid,jaw50,jaw100').split(',');
const spec = { base: {}, blink50: { blink: .5 }, blink100: { blink: 1 }, lid: { lid: .32 }, jaw50: { jaw: .5 }, jaw100: { jaw: 1 } };
let pending = 0;
for (const id of ids) for (const f of frames) {
  const fig = document.createElement('figure'); const host = document.createElement('div'); const cap = document.createElement('figcaption'); cap.textContent = id + ' · ' + f;
  fig.append(host, cap); document.body.append(fig); pending++;
  const lp = createLivingPortrait(host);
  lp.setSource('../../../src/assets/portraits/' + id + '.webp', PORTRAIT_RIGS[id]);
  const wait = () => { if (lp.renderFrame(spec[f])) { if (--pending === 0) document.body.dataset.ready = '1'; } else setTimeout(wait, 30); }; wait();
}
</script></body></html>
